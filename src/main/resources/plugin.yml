name: Coreon
version: '1.0.0'
main: at.blaulix.coreon.Coreon
api-version: '1.21'

commands:
  coreon:
    description: Coreon Hauptbefehl
    usage: /coreon
  invsee:
    description: Öffnet das Inventar eines Spielers
    usage: /invsee <Spieler>
    permission: coreon.invsee
  vanish:
    description: Verschwinde vor anderen Spielern
    usage: /vanish
    permission: coreon.vanish
  home:
    description: Gives you homes.
    usage: /home <Name>
    permission: coreon.homes.teleport
  homes:
    description: Lists your homes.
    usage: /homes <Playername>
    permission: coreon.homes.list
  sethome:
    description: Setzt ein Home an deiner aktuellen Position
    usage: /sethome <Name>
    permission: coreon.homes.set
  deletehome:
    description: Löscht ein Home
    usage: /delhome <Name>
    permission: coreon.homes.delete
  pvptimer:
    description: Sets a global PvP disable timer.
    usage: /pvptimer <minutes>
    permission: coreon.pvptimer
  ec:
    description: Öffnet deine eigene Enderchest
    usage: /ec
    permission: coreon.ec
