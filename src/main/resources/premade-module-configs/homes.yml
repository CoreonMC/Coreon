max-homes:
  default: 3   # Default maximum homes per player

# Teleport Einstellungen
teleport:
  delay-seconds: 3       # Seconds to wait before teleporting (0 for instant)
  cancel-on-move: true   # Cancel teleport if the player moves
# Kosten (benötigt Vault + Economy Plugin)

# Costs (requires Vault + Economy Plugin)
costs:
  sethome: 0
  home: 0
  delhome: 0

# Messages
messages:
  prefix: "&8[&bHomes&8] "

  # %home% = Home name, %delay% = Teleport delay in seconds, %cooldown% = Cooldown time in seconds
  home-set: "&aHome &b%home% &ahas been set!"
  home-deleted: "&cYour home has been deleted!"
  home-teleport: "&aTeleporting to your home in {delay} seconds. Don't move!"
  home-teleported: "&aTeleported to home &b%home%&a!"
  teleport-cancelled: "&cTeleport cancelled because you moved!"
  home-not-exist: "&cNo home named &b%home%&c found!"
  # %limit% = Maximum number of homes allowed
  max-homes: "&cYou have reached the maximum number of homes &7(%limit%)&c!"
  # %homes% = Comma-separated list of home names
  home-list: "&aYour homes: &b%homes%"